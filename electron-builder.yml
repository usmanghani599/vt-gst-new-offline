appId: com.vivertech.vtgst.desktop
productName: VTGST Desktop
copyright: Copyright © Viver Technologies

directories:
  output: release
  buildResources: installer

# Only the compiled main/preload code goes into app.asar. The whole local
# Next.js server ships as ONE file, resources/server.asar (built by
# scripts/prepare-bundle.mjs). The app unpacks it on first start and verifies
# every file against the manifest hash compiled into the main process.
files:
  - dist-electron/**/*
  - electron-static/**/*
  - package.json
  - "!**/node_modules/**/*"
extraResources:
  - from: build/server.asar
    to: server.asar
afterPack: scripts/after-pack.cjs

asar: true
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Electron fuses: block the common ways of tampering with / debugging the app.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: installer/icon.png
  # Code signing: set CSC_LINK (path/URL to .pfx) and CSC_KEY_PASSWORD in the build environment.
  signtoolOptions:
    publisherName: Viver Technologies

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VTGST Desktop
  deleteAppDataOnUninstall: false

mac:
  target: dmg
  category: public.app-category.business
  icon: installer/icon.png
  hardenedRuntime: true

linux:
  target: AppImage
  icon: installer/icon.png
  category: Office
